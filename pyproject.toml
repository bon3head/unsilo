[project]
name = "unsilo"
version = "0.1.0"
description = "UnSilo: Docket (operator plane) and evidence plane. Private, single operator, never distributed."
requires-python = ">=3.11"
# Exact pins (D-1). The engine pin is load-bearing: SQLite 3.53.4 ships inside
# the apsw wheel and is recorded in every closure (B10 dependency class).
dependencies = [
  "apsw==3.53.4.0",
  "tzdata==2026.4",
  "starlette==1.7.0",
  "jinja2==3.1.6",
  "markupsafe==3.0.3",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
# Rendered acquisition (S2). The Playwright version pins its browser build:
# 1.56.0 maps to Chromium build 1194 (141.0.7390.37), stack-verification G3.
render = ["playwright==1.56.0"]

[project.scripts]
unsilo = "unsilo.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["unsilo*"]

[tool.setuptools.package-data]
unsilo = ["migrations/*.sql", "schema_src/*.sql", "web/templates/*.html", "web/static/*"]
