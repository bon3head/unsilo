<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}UnSilo Docket{% endblock %}</title>
<style>
:root{--bg:#0b0d0c;--panel:#111513;--line:#22302a;--fg:#c9d6cf;--dim:#7d8c84;--green:#5fd38d;--amber:#f0b84a;--red:#ff6b6b;--blue:#7fb4ff;--hatch:#f0b84a22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
a{color:var(--blue)}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
header h1{margin:0;font-size:16px;letter-spacing:.08em;color:var(--green)}
header .tag{color:var(--amber)}
header .sub{color:var(--dim);flex-basis:100%}
main{padding:0 16px 24px;max-width:1400px;margin:0 auto}
section{margin-top:16px}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
h2 a{font-size:11px;text-transform:none;letter-spacing:0}
.cutbar{margin-top:10px;padding:6px 8px;border:1px dashed var(--line);color:var(--dim);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cutbar input{background:var(--panel);color:var(--fg);border:1px solid var(--line);font:inherit;padding:2px 4px}
.strip{border:1px solid var(--amber);background:#17130a;padding:6px 8px}
.strip .row{overflow-wrap:anywhere;display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:2px 10px;padding:4px 0;border-bottom:1px solid #2a2414}
.strip .row:last-child{border-bottom:0}
.strip .id{color:var(--amber);font-weight:bold}
.pill{display:inline-block;padding:0 6px;border:1px solid currentColor;border-radius:2px;font-size:11px;white-space:nowrap}
.p-OPEN,.p-ACTION_NEEDED,.p-KILLED{color:var(--red)}
.p-REPAIRED_PENDING_ADMISSION,.p-UNADMITTED,.p-HELD_FOR_REVIEW,.p-DOWNGRADED,.p-UNRESOLVED{color:var(--amber)}
.p-RETAINED,.p-RETAINED_INTEGRATION_VERIFIED,.p-SUBMITTED,.p-CONFIRMED,.p-FROZEN,.p-CLOSED,.p-DONE{color:var(--green)}
.p-REJECTED,.p-WITHDRAWN,.p-DROPPED{color:var(--dim)}
.t-TRUE{color:var(--green)}.t-FALSE{color:var(--dim)}.t-UNKNOWN{color:var(--amber);background:repeating-linear-gradient(45deg,transparent 0 4px,var(--hatch) 4px 6px)}
.dim{color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);padding:8px 10px}
.card h3{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.card table{width:100%;border-collapse:collapse}
.card td{vertical-align:top;padding:1px 0;overflow-wrap:anywhere}
.card td.k{color:var(--dim);width:72px;padding-right:6px}
.unknown{color:var(--amber)}
.acts{margin:6px 0 0;padding:0;list-style:none}
.acts li{border-top:1px dotted var(--line);padding:4px 0}
.acts li::before{content:"> ";color:var(--red)}
form.inline{display:inline}
button,select{background:transparent;color:var(--fg);border:1px solid var(--line);font:inherit;font-size:11px;padding:1px 6px;cursor:pointer}
button:hover{border-color:var(--green);color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.chips label{border:1px solid var(--line);padding:1px 8px;cursor:pointer}
.chips input[type=radio]{display:none}
.chips input[type=radio]:checked+span{color:var(--green)}
.chips input[type=search]{background:var(--panel);color:var(--fg);border:1px solid var(--line);font:inherit;padding:3px 6px;min-width:0;flex:1 1 160px}
.feed{list-style:none;margin:0;padding:0}
.feed li{overflow-wrap:anywhere;display:grid;grid-template-columns:minmax(150px,210px) 110px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.feed .ttl{color:var(--fg)}
.feed .body{color:var(--dim)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px}
.grid2 section{min-width:0;overflow-x:auto}
input,select{max-width:100%}
table.t{border-collapse:collapse;width:100%}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:2px 6px;text-align:left}
table.t th{color:var(--dim);font-weight:normal}
.num{text-align:right}
.tl text{fill:var(--dim);font:10px ui-monospace,monospace}.tl .lab{fill:var(--fg);font-size:11px}
.tl .grid{stroke:var(--line)}.tl .cut{fill:#7fb4ff14;stroke:var(--blue);stroke-dasharray:3 3}.tl .cutl{fill:var(--blue)}
.tl .ev{fill:var(--green)}.tl .st-HELD_FOR_REVIEW{fill:var(--amber)}.tl .known{fill:#5fd38d55}.tl .unk{stroke:var(--amber);stroke-width:.5}.tl .hatch{stroke:var(--amber);stroke-width:2}
details summary{cursor:pointer;color:var(--dim)}
pre{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);padding:8px;overflow-x:auto}
footer{color:var(--dim);border-top:1px solid var(--line);padding:10px 16px;font-size:11px}
@media (max-width:640px){.feed li{grid-template-columns:1fr}.strip .row{grid-template-columns:1fr}}
</style>
<link rel="icon" href="data:,">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
